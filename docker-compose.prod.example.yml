version: '3.8'

services:
  app:
    build: .
    container_name: dashboard_talleres_api
    restart: unless-stopped
    networks:
      - root_default
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.docker.network=root_default"
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-talleres.rule=Host(`dashboard.example.com`)"
      - "traefik.http.routers.dashboard-talleres.entrypoints=websecure"
      - "traefik.http.routers.dashboard-talleres.tls=true"
      - "traefik.http.routers.dashboard-talleres.tls.certresolver=mytlschallenge"
      - "traefik.http.services.dashboard-talleres.loadbalancer.server.port=8000"

networks:
  root_default:
    external: true
