services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - proxy_network
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.docker.network=${PROXY_NETWORK:-proxy_network}"
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${APP_DOMAIN:-app.example.com}`)"
      - "traefik.http.routers.app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

networks:
  proxy_network:
    external: true
    name: ${PROXY_NETWORK:-proxy_network}
