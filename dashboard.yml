http:
  routers:
    dashboard-final-file:
      rule: "Host(`dashboard.matiasbarreto.com`)"
      entryPoints:
        - websecure
      service: dashboard-final-svc
      tls:
        certResolver: mytlschallenge
  services:
    dashboard-final-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://dashboard_talleres_api:8000"
